<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>in_work</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Та же композиция, что accepted.html: меняются только значок и надпись. */
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background-position: center;
  }
  .badge {
    width: 230px; height: 230px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-400);
    box-shadow: 0 0 0 18px color-mix(in oklch, var(--accent-400) 22%, transparent);
  }
  .badge svg { width: 140px; height: 140px; }
  .title { font-size: 150px; margin-top: 64px; letter-spacing: 1px; }
  .brand { position: absolute; left: 56px; top: 48px; font-size: 46px; letter-spacing: 2px; color: var(--accent-400); }
</style></head>
<body>
  <!-- Без номера заявки, имени и сроков: номер — в подписи (texts.CLIENT_TAKEN). Без портрета. -->
  <div class="display brand">ЭДУАРД ТОРГАШОВ</div>
  <div class="badge">
    <!-- Гаечный ключ своей фигурой: рукоять и головка с зевом, повёрнуты на 45°.
         Зев «вырезан» кругом цвета значка, поэтому иконка не зависит от шрифтов. -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g transform="rotate(45 12 12)" fill="oklch(0.28 0.102 14)">
        <rect x="10.2" y="9" width="3.6" height="14" rx="1.8"/>
        <circle cx="12" cy="6.2" r="5.4"/>
        <rect x="10.1" y="0" width="3.8" height="6.4" fill="oklch(0.81 0.118 78)"/>
      </g>
    </svg>
  </div>
  <div class="display title">ЗАЯВКА В РАБОТЕ</div>
</body></html>

[project]
name = "ferz-bot"
version = "0.1.0"
description = "Telegram-бот приёма заявок для сайта Эдуарда Торгашова"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.31,<4",
    "pydantic-settings>=2.6,<3",
    "tzdata>=2024.1",  # macOS/Linux обычно имеют базу часовых поясов, Windows — нет
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[tool.uv]
package = false  # это приложение, а не библиотека: ставить сам проект в venv не нужно

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма для проекта

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert и фиктивные токены в тестах — нормально

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["bot"]
